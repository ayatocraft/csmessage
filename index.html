<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メッセージカード</title>
<style>
*{box-sizing:border-box}
:root{--bg1:#1b0b14;--bg2:#3a0f1f;--red:#e63950;--gold:#ffd46b;--text:#fff4f6;--panel:rgba(255,255,255,.08);--line:rgba(255,212,107,.25);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#ffe9ee;--bg2:#ffd6df;--text:#3a1020;--panel:rgba(255,255,255,.8);--line:rgba(184,35,47,.25);color-scheme:light}}
html,body{margin:0;min-height:100%}
body{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:radial-gradient(circle at top,var(--bg2),var(--bg1));min-height:100vh}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.center{text-align:center}
.muted{opacity:.75;font-size:.88rem;line-height:1.6}
.small{font-size:.8rem}
.err{color:#ff8fa0;font-size:.9rem;min-height:1.2em}
.warn{color:var(--gold);font-size:.9rem;line-height:1.6}
.steps{font-size:.8rem;opacity:.7;text-align:center;margin:0 0 6px}
h2{color:var(--gold);font-size:1.15rem;margin:8px 0}
h3{font-size:1rem;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
label{display:block;font-size:.85rem;margin:12px 0 4px}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
input,textarea{width:100%;padding:11px 12px;font-size:1rem;font-family:inherit;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:rgba(0,0,0,.18);color:var(--text)}
input[type=checkbox],input[type=range],input[type=color]{width:auto}
input[type=color]{width:44px;height:36px;padding:2px}
textarea{resize:vertical;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;color:#fff;font-size:.95rem;font-weight:600;padding:12px 16px;background:linear-gradient(135deg,var(--red),#c2185b)}
button:disabled{opacity:.45;cursor:default}
button.block{display:block;width:100%;margin-top:10px}
button.alt{background:linear-gradient(135deg,#2bb673,#13805a)}
button.danger{background:#8a2a3a}
button.ghost{background:rgba(128,128,128,.28);font-weight:500}
button.small{padding:7px 11px;font-size:.82rem;border-radius:10px}
button.on{background:linear-gradient(135deg,var(--gold),#e0a030);color:#3a1020}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row-btns>button{flex:1;min-width:110px}
.link{word-break:break-all;font-size:.85rem;background:rgba(0,0,0,.25);padding:10px;border-radius:10px;margin:8px 0;user-select:all}
.qr{background:#fff;padding:10px;border-radius:10px;width:fit-content;margin:14px auto}
.banner{background:rgba(255,212,107,.15);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:.9rem;line-height:1.6}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 4px}
.home-head .name{font-size:1.2rem;color:var(--gold);font-weight:700}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding-bottom:40px}
.empty{white-space:pre-line;text-align:center;opacity:.75;padding:40px 10px;font-size:.95rem}
.card-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card-row .grow{flex:1;min-width:0}
.card-row .to{font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.78rem;opacity:.85;margin-top:3px}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;margin-right:4px;color:#fff}
.badge.on{background:#2bb673}.badge.off{background:#7a7a8a}.badge.ended{background:#b8232f}
.swatch{width:42px;height:56px;border-radius:8px;flex:none;background:var(--sbg);border:2px solid var(--sacc)}
.card-row .row-btns{margin:0;flex-direction:column}
.card-row .row-btns>button{flex:none;min-width:0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#2a1020;color:#fff4f6;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .sheet{background:#fff;color:#3a1020}}
.sheet label{color:inherit}
.sheet .sheetbtn{display:block;width:100%;margin-top:10px;background:rgba(128,128,128,.25)}
/* ---------- theme ---------- */
.stage{--sbg:#fff;--sfg:#333;--sacc:#b8232f;--sfont:sans-serif;width:100%;aspect-ratio:3/4;container-type:inline-size;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);background:var(--sbg);color:var(--sfg);font-family:var(--sfont);box-sizing:border-box}
.stage.th-xmas{--sbg:linear-gradient(#fff7f2,#ffe6e0);--sfg:#5a1a2a;--sacc:#b8232f;--sfont:"Yu Mincho","Hiragino Mincho ProN",serif;border:6px double #b8232f}
.stage.th-snow{--sbg:linear-gradient(#ffffff,#e4eff9);--sfg:#2c3e50;--sacc:#4a86b8;--sfont:"Hiragino Sans","Yu Gothic",sans-serif;border:2px solid #b8d4ea}
.stage.th-night{--sbg:linear-gradient(#22305c,#0b1020);--sfg:#fff3d6;--sacc:#ffd46b;--sfont:"Hiragino Sans",sans-serif;border:2px solid #ffd46b}
.stage.th-letter{--sbg:#fdf6e3;--sfg:#4a3a28;--sacc:#8b6b3d;--sfont:"Yu Mincho",serif;border:10px solid #e7d7b5}
.stage.th-pink{--sbg:linear-gradient(135deg,#ffe3ec,#ffd1e0);--sfg:#7a1f45;--sacc:#e0457b;--sfont:"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif;border:4px solid #f49ac0;border-radius:24px}
.hdr{position:absolute;left:8%;right:8%;color:var(--sacc);font-size:4cqw;pointer-events:none;z-index:0}
.hdr-to{top:5%;font-weight:700}
.hdr-from{bottom:4%;text-align:right}
.item{position:absolute;box-sizing:border-box;touch-action:none}
.item.text{white-space:pre-wrap;word-break:break-word;overflow:hidden;line-height:1.55}
.item.text a{color:inherit;text-decoration:underline}
.item.img img,.item.vid video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.item.vid video{pointer-events:auto}
.stage.edit .item.vid video{pointer-events:none}
.vidph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15);border-radius:8px;font-size:4cqw}
.item .handle{display:none;position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:2px solid #fff;cursor:nwse-resize;touch-action:none}
.item.sel{outline:2px dashed var(--gold);outline-offset:2px}
.item.sel .handle{display:block}
.stagewrap,.stagewrap-view{max-width:420px;margin:0 auto}
.stagewrap-view{margin-bottom:14px}
.reveal{animation:fade .9s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.topbar .grow{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:.75rem;opacity:.8;white-space:nowrap}
.canvas-area{flex:1;overflow:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch}
.panel-sel{max-width:420px;margin:12px auto 0}
.pbox{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.pbox textarea{font-size:.95rem}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sl{display:flex;align-items:center;gap:10px;font-size:.82rem;margin:0}
.sl input{flex:1}
.hint{font-size:.82rem;opacity:.7;text-align:center;padding:10px}
.tools{flex:none;display:flex;justify-content:space-around;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);overflow-x:auto}
.tool{flex:1;min-width:52px;background:transparent;color:var(--text);padding:6px 2px;font-size:.72rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool .ico{font-size:1.35rem;line-height:1}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamps button{background:rgba(128,128,128,.25);font-size:1.6rem;padding:10px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes button{background:transparent;padding:0;border:none;color:inherit}
.themes .sw{height:70px;border-radius:10px;margin-bottom:4px}
/* ---------- viewer ---------- */
.viewer{max-width:420px;margin:0 auto;padding-top:10px}
.countdown{font-size:1.6rem;color:var(--gold);font-variant-numeric:tabular-nums;margin:14px 0;text-align:center}
.share .qr{margin:14px auto}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ===== 設定 =====
const SUPABASE_URL = 'https://kfcbolbutvqpxvfwhwig.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmY2JvbGJ1dHZxcHh2Zndod2lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMTQ1MzEsImV4cCI6MjEwOTc5MDUzMX0.sTyIoieOKyZ0BnWQKA7T2eABL8y_Is6LCXktiy1Mxww';
const BUCKET = 'card-media';
// ================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById('app');
const BASE = location.origin + location.pathname;
const PARAMS = new URLSearchParams(location.search);
const EDIT = PARAMS.get('edit');
const VIEW = /^\d{16}$/.test(location.search.slice(1)) ? location.search.slice(1) : null;
const LS = { birth: 'msgBirth', sender: 'msgSender', owner: 'msgOwner' };
const sender = () => localStorage.getItem(LS.sender) || '';
const owner = () => localStorage.getItem(LS.owner) || '';

const THEMES = {
  xmas:   { name: 'クリスマス', cls: 'th-xmas',   sw: 'linear-gradient(#fff7f2,#ffe6e0)', text: '#5a1a2a' },
  snow:   { name: '雪景色',     cls: 'th-snow',   sw: 'linear-gradient(#ffffff,#e4eff9)', text: '#2c3e50' },
  night:  { name: '聖夜の空',   cls: 'th-night',  sw: 'linear-gradient(#22305c,#0b1020)', text: '#fff3d6' },
  letter: { name: '便箋',       cls: 'th-letter', sw: '#fdf6e3',                          text: '#4a3a28' },
  pink:   { name: 'ピンク',     cls: 'th-pink',   sw: 'linear-gradient(135deg,#ffe3ec,#ffd1e0)', text: '#7a1f45' }
};
const textColor = t => (THEMES[t] || THEMES.xmas).text;

// ---------- ユーティリティ ----------
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'class') el.className = v;
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const setScreen = (...nodes) => $app.replaceChildren(...nodes);
const loadingNode = () => h('p', { class: 'muted center' }, '読み込み中…');
const pad = n => String(n).padStart(2, '0');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const uid = () => crypto.randomUUID();
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
function ageOn(birth) {
  const [ty, tm, td] = today().split('-').map(Number);
  const [by, bm, bd] = birth.split('-').map(Number);
  let a = ty - by;
  if (tm < bm || (tm === bm && td < bd)) a--;
  return a;
}
const inSeason = () => [2, 11, 12].includes(Number(today().slice(5, 7)));
const fmt = iso => iso ? new Date(iso).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const toLocal = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
function errText(error) {
  const m = error?.message || '';
  if (m.includes('locked')) return '利用期間外のため編集・公開操作はできません';
  if (m.includes('period_closed')) return '現在は利用期間外です';
  if (m.includes('age_restricted')) return '11歳以上の方がご利用いただけます';
  if (m.includes('not_found')) return 'このカードは見つかりません';
  if (m.includes('invalid_password')) return 'パスワードを入力してください';
  return '通信に失敗しました。時間をおいて再度お試しください';
}
function message(title, text, toHome = false) {
  setScreen(h('section', { class: 'panel center' },
    h('h2', {}, title), h('p', { class: 'muted' }, text),
    toHome ? h('button', { class: 'block', on: { click: home } }, '一覧へ戻る') : null));
}
function openSheet(nodes) {
  const close = () => bg.remove();
  const sheet = h('div', { class: 'sheet', on: { click: e => e.stopPropagation() } }, nodes);
  const bg = h('div', { class: 'sheet-bg', on: { click: close } }, sheet);
  document.body.append(bg);
  return close;
}
function copy(text) {
  navigator.clipboard.writeText(text).then(() => alert('コピーしました')).catch(() => alert(text));
}
function linkify(el, text) {
  const re = /https?:\/\/[^\s]+/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) el.append(text.slice(last, m.index));
    el.append(h('a', { href: m[0], target: '_blank', rel: 'noopener noreferrer' }, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) el.append(text.slice(last));
}

// ---------- 初期設定 ----------
function birthScreen(done) {
  const input = h('input', { type: 'date', max: today() });
  const err = h('p', { class: 'err' });
  setScreen(h('section', { class: 'panel' },
    h('p', { class: 'steps' }, '初期設定 1/2'),
    h('h2', {}, '生年月日'),
    h('p', { class: 'muted' }, '最初の1回だけ入力します。この端末に保存され、次回からは入力不要です。'),
    input, err,
    h('button', { class: 'block', on: { click: () => {
      if (!input.value) { err.textContent = '生年月日を入力してください'; return; }
      if (ageOn(input.value) < 11) {
        return message('ご利用いただけません', 'このサービスは11歳以上の方がご利用いただけます。');
      }
      localStorage.setItem(LS.birth, input.value);
      done();
    } } }, '次へ')));
}
function senderScreen(done) {
  const input = h('input', { maxlength: 20, placeholder: '例：さくら' });
  const err = h('p', { class: 'err' });
  setScreen(h('section', { class: 'panel' },
    h('p', { class: 'steps' }, '初期設定 2/2'),
    h('h2', {}, '差出人名'),
    h('p', { class: 'muted' }, 'この端末で作るカードの差出人名です。一度決めると変更できません。'),
    input, err,
    h('button', { class: 'block', on: { click: () => {
      const v = input.value.trim();
      if (!v) { err.textContent = '差出人名を入力してください'; return; }
      localStorage.setItem(LS.sender, v);
      done();
    } } }, '決定')));
}
function birthGate(next) {
  const b = localStorage.getItem(LS.birth);
  if (!b) return birthScreen(() => birthGate(next));
  if (ageOn(b) < 11) return message('ご利用いただけません', '11歳以上の方がご利用いただけます。');
  next();
}
function ensureSetup(next) {
  birthGate(() => {
    if (!localStorage.getItem(LS.sender)) return senderScreen(() => ensureSetup(next));
    if (!localStorage.getItem(LS.owner)) localStorage.setItem(LS.owner, uid());
    next();
  });
}

// ---------- ホーム ----------
async function home() {
  history.replaceState(null, '', BASE);
  setScreen(loadingNode());
  const { data, error } = await sb.rpc('list_cards', { p_owner: owner() });
  if (error) return message('読み込みに失敗しました', errText(error), false);
  const head = h('div', { class: 'home-head' },
    h('div', {}, h('div', { class: 'muted small' }, '差出人'), h('div', { class: 'name' }, sender())),
    h('button', { on: { click: newCard } }, '＋ 新しく作る'));
  const list = h('div', { class: 'list' });
  if (!data || !data.length) list.append(h('div', { class: 'empty' }, 'まだカードがありません。\n「新しく作る」から始めましょう。'));
  for (const c of data || []) list.append(cardRow(c));
  setScreen(h('div', {}, head, list));
}

async function newCard() {
  const { data, error } = await sb.rpc('create_card', {
    p_birth: localStorage.getItem(LS.birth), p_owner: owner(), p_from: sender(), p_to: ''
  });
  if (error) return alert(errText(error));
  openEditor(data.edit_token);
}

function cardRow(c) {
  const th = THEMES[c.theme] || THEMES.xmas;
  const ended = Date.now() >= new Date(c.use_end).getTime();
  const [label, kind] = ended ? ['期間終了', 'ended'] : (c.published ? ['公開中', 'on'] : ['非公開', 'off']);
  return h('div', { class: 'card-row' },
    h('div', { class: `swatch ${th.cls}` }),
    h('div', { class: 'grow' },
      h('div', { class: 'to' }, c.to_name ? `Dear ${c.to_name}` : '無題のカード'),
      h('div', {}, h('span', { class: `badge ${kind}` }, label)),
      h('div', { class: 'meta' }, `利用期限 ${fmt(c.use_end)}`),
      c.open_at ? h('div', { class: 'meta' }, `開封 ${fmt(c.open_at)}`) : null,
      c.has_password ? h('div', { class: 'meta' }, '🔒 パスワードあり') : null),
    h('div', { class: 'row-btns' },
      h('button', { class: 'small', disabled: ended, on: { click: () => openEditor(c.edit_token) } }, '編集'),
      h('button', { class: 'ghost small', on: { click: () => rowMenu(c, ended) } }, '⋯')));
}

function rowMenu(c, ended) {
  let close;
  const toggle = async () => {
    const { error } = await sb.rpc('set_published', { p_token: c.edit_token, p_on: !c.published });
    close();
    if (error) return alert(errText(error));
    home();
  };
  const del = () => {
    close();
    const cancel = openSheet([
      h('h3', {}, '削除しますか？'),
      h('p', { class: 'muted' }, 'このカードと画像・動画はすべて消えます。元に戻せません。'),
      h('button', { class: 'block danger', on: { click: async () => {
        const { error } = await sb.rpc('delete_card', { p_token: c.edit_token });
        cancel();
        if (error) return alert(errText(error));
        home();
      } } }, '削除する'),
      h('button', { class: 'sheetbtn ghost block', on: { click: () => cancel() } }, 'やめる')
    ]);
  };
  close = openSheet([
    h('h3', {}, c.to_name ? `Dear ${c.to_name}` : '無題のカード'),
    h('button', { class: 'block ghost', on: { click: () => { close(); shareScreen(c.code, c.edit_token, c.published); } } }, '共有リンク・QR'),
    ended ? null : h('button', { class: 'block alt', on: { click: toggle } }, c.published ? '公開を停止する' : '公開する'),
    h('button', { class: 'block danger', on: { click: del } }, '削除する'),
    h('button', { class: 'block ghost', on: { click: () => close() } }, '閉じる')
  ]);
}

function shareScreen(code, token, published) {
  const viewUrl = `${BASE}?${code}`;
  const editUrl = `${BASE}?edit=${token}`;
  const qrBox = h('div', { class: 'qr' });
  setScreen(h('section', { class: 'panel share center' },
    h('h2', {}, '公開リンク'),
    published ? null : h('p', { class: 'warn' }, '※ いまは非公開です。公開するまで閲覧リンクは開けません。'),
    h('p', { class: 'muted' }, 'この閲覧リンクを相手に送ってください'),
    h('div', { class: 'link' }, viewUrl),
    qrBox,
    h('div', { class: 'row-btns' }, h('button', { on: { click: () => copy(viewUrl) } }, '閲覧リンクをコピー')),
    h('hr', { style: 'opacity:.3;margin:18px 0' }),
    h('p', { class: 'warn' }, '編集リンク（あなた専用・別の端末で編集するときに使用）'),
    h('div', { class: 'link' }, editUrl),
    h('div', { class: 'row-btns' }, h('button', { class: 'ghost', on: { click: () => copy(editUrl) } }, '編集リンクをコピー')),
    h('button', { class: 'block ghost', on: { click: () => home() } }, '一覧へ戻る')));
  new QRCode(qrBox, { text: viewUrl, width: 180, height: 180 });
}

// ---------- 編集：状態 ----------
async function openEditor(token) {
  setScreen(loadingNode());
  const { data, error } = await sb.rpc('load_card', { p_token: token });
  if (error) return message('編集できません', errText(error), true);
  history.replaceState(null, '', '?edit=' + token);
  const c = data.content && !Array.isArray(data.content) ? data.content : {};
  const S = {
    token, code: data.code,
    to: data.to_name || '', from: sender(),
    openOn: !!data.open_at, open: toLocal(data.open_at),
    hadPw: !!data.has_password, pwOn: !!data.has_password, pw: '',
    published: !!data.published,
    theme: c.theme || 'xmas',
    items: Array.isArray(c.items) ? c.items : [],
    sel: null, dirty: false, saving: false, timer: null
  };
  renderEditor(S);
}

function nextZ(S) { return S.items.reduce((m, i) => Math.max(m, i.z), 0) + 1; }
function setStatus(msg) { const el = document.getElementById('st'); if (el) el.textContent = msg; }

function markDirty(S) {
  S.dirty = true;
  setStatus('未保存');
  clearTimeout(S.timer);
  S.timer = setTimeout(() => flush(S), 2000);
}

async function saveDraft(S, publish) {
  const pwAction = S.pwOn ? (S.pw ? 'set' : 'keep') : (S.hadPw ? 'clear' : 'keep');
  const { error } = await sb.rpc('save_card', {
    p_token: S.token,
    p_from: sender(),
    p_to: S.to.trim(),
    p_open: S.openOn && S.open ? new Date(S.open).toISOString() : null,
    p_pw_action: pwAction,
    p_password: S.pwOn && S.pw ? S.pw : null,
    p_content: { theme: S.theme, items: S.items },
    p_publish: publish
  });
  if (error) return errText(error);
  S.hadPw = S.pwOn;
  S.pw = '';
  return null;
}

async function flush(S) {
  if (S.saving || !S.dirty) return;
  S.saving = true;
  S.dirty = false;
  setStatus('保存中…');
  const err = await saveDraft(S, false);
  S.saving = false;
  if (err) { S.dirty = true; setStatus('保存できませんでした'); return; }
  setStatus(S.dirty ? '未保存' : '保存済み');
  if (S.dirty) markDirty(S);
}

function validate(S) {
  if (!S.to.trim()) return '宛名を入力してください';
  if (S.openOn && !S.open) return '開封日時を入力してください';
  if (S.pwOn && !S.hadPw && !S.pw) return 'パスワードを入力してください';
  if (!S.items.length) return '内容を1つ以上入れてください';
  return null;
}

// ---------- 編集：画面 ----------
function renderEditor(S) {
  const fileImg = h('input', { type: 'file', accept: 'image/*', hidden: true,
    on: { change: e => { handleFile(S, e.target.files[0], 'img'); e.target.value = ''; } } });
  const fileCam = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true,
    on: { change: e => { handleFile(S, e.target.files[0], 'img'); e.target.value = ''; } } });
  const fileVid = h('input', { type: 'file', accept: 'video/*', hidden: true,
    on: { change: e => { handleFile(S, e.target.files[0], 'vid'); e.target.value = ''; } } });

  const tool = (icon, label, fn) => h('button', { class: 'tool', on: { click: fn } },
    h('span', { class: 'ico' }, icon), label);

  setScreen(h('div', { class: 'editor' },
    h('div', { class: 'topbar' },
      h('button', { class: 'ghost small', on: { click: async () => { await flush(S); home(); } } }, '← 一覧'),
      h('div', { class: 'grow' }, S.to ? `Dear ${S.to}` : '無題のカード'),
      h('span', { class: 'status', id: 'st' }, S.dirty ? '未保存' : '保存済み'),
      h('button', { class: 'ghost small', on: { click: () => settingsSheet(S) } }, '⚙'),
      h('button', { class: 'small', on: { click: () => confirmScreen(S) } }, '確認へ')),
    h('div', { class: 'canvas-area' },
      h('div', { class: 'stagewrap', id: 'stagewrap' }),
      h('div', { class: 'panel-sel', id: 'panel' })),
    h('div', { class: 'tools' },
      tool('🔤', '文字', () => addItem(S, { type: 'text', text: 'ここに入力', size: 5, color: textColor(S.theme), bold: false, align: 'center', x: 18, y: 42, w: 64, h: 12 })),
      tool('🖼️', '画像', () => fileImg.click()),
      tool('📷', 'カメラ', () => fileCam.click()),
      tool('🎬', '動画', () => fileVid.click()),
      tool('✨', 'スタンプ', () => stampSheet(S)),
      tool('🎨', 'デザイン', () => themeSheet(S))),
    fileImg, fileCam, fileVid));
  refreshEditor(S);
}

function refreshEditor(S) {
  const wrap = document.getElementById('stagewrap');
  if (!wrap) return;
  wrap.replaceChildren(buildStage(S, 'edit'));
  refreshPanel(S);
}
function refreshPanel(S) {
  const p = document.getElementById('panel');
  if (p) p.replaceChildren(buildPanel(S));
}
function selectVisual(S) {
  document.querySelectorAll('#stagewrap .item').forEach(el => el.classList.toggle('sel', el.dataset.id === S.sel));
}

function buildStage(S, mode) {
  const th = THEMES[S.theme] || THEMES.xmas;
  const stage = h('div', { class: `stage ${th.cls}${mode === 'edit' ? ' edit' : ''}` });
  stage.append(h('div', { class: 'hdr hdr-to' }, S.to ? `Dear ${S.to}` : 'Dear ……'));
  stage.append(h('div', { class: 'hdr hdr-from' }, S.from ? `From ${S.from}` : ''));
  for (const it of [...S.items].sort((a, b) => a.z - b.z)) stage.append(buildItem(S, it, mode));
  if (mode === 'edit') {
    stage.addEventListener('pointerdown', e => {
      if (e.target !== stage) return;
      S.sel = null;
      selectVisual(S);
      refreshPanel(S);
    });
  }
  return stage;
}

function applyGeom(el, it) {
  el.style.left = it.x + '%';
  el.style.top = it.y + '%';
  el.style.width = it.w + '%';
  el.style.height = it.h + '%';
  el.style.zIndex = it.z;
}

function buildItem(S, it, mode) {
  const el = h('div', { class: `item ${it.type}` });
  el.dataset.id = it.id;
  applyGeom(el, it);
  if (it.type === 'text') {
    el.style.fontSize = it.size + 'cqw';
    el.style.color = it.color || 'inherit';
    el.style.fontWeight = it.bold ? '700' : '400';
    el.style.textAlign = it.align || 'center';
    linkify(el, it.text || '');
  } else if (it.type === 'img') {
    el.append(h('img', { src: it.u, draggable: false, alt: '' }));
  } else if (it.type === 'vid') {
    if (mode === 'shot') el.append(h('div', { class: 'vidph' }, '🎬 動画'));
    else el.append(h('video', { src: it.u, controls: mode === 'view', playsInline: true, muted: mode === 'edit', preload: 'metadata' }));
  }
  if (mode === 'edit') {
    if (S.sel === it.id) el.classList.add('sel');
    el.append(h('div', { class: 'handle' }));
    el.addEventListener('pointerdown', e => {
      e.stopPropagation();
      const isHandle = e.target.classList.contains('handle');
      if (S.sel !== it.id) { S.sel = it.id; selectVisual(S); refreshPanel(S); }
      dragItem(e, S, it, el, isHandle);
    });
  }
  return el;
}

function dragItem(e, S, it, el, resize) {
  e.preventDefault();
  const stage = el.parentElement;
  const r = stage.getBoundingClientRect();
  el.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY, ox = it.x, oy = it.y, ow = it.w, oh = it.h;
  let moved = false;
  const move = ev => {
    const dx = (ev.clientX - sx) / r.width * 100;
    const dy = (ev.clientY - sy) / r.height * 100;
    if (Math.abs(dx) + Math.abs(dy) > 0.3) moved = true;
    if (resize) {
      it.w = clamp(ow + dx, 6, 100 - it.x);
      it.h = it.ratio ? it.w * it.ratio : clamp(oh + dy, 4, 100 - it.y);
      if (it.y + it.h > 100) it.h = 100 - it.y;
    } else {
      it.x = clamp(ox + dx, 0, 100 - it.w);
      it.y = clamp(oy + dy, 0, 100 - it.h);
    }
    applyGeom(el, it);
  };
  const up = () => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);
    if (moved) { markDirty(S); refreshPanel(S); }
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

function patchEl(S, it) {
  const old = document.querySelector(`#stagewrap [data-id="${it.id}"]`);
  if (old) old.replaceWith(buildItem(S, it, 'edit'));
}

function addItem(S, base) {
  const it = { ...base, id: uid(), z: nextZ(S) };
  S.items.push(it);
  S.sel = it.id;
  markDirty(S);
  refreshEditor(S);
  return it;
}

function slider(label, min, max, step, val, fn) {
  return h('label', { class: 'sl' }, label,
    h('input', { type: 'range', min, max, step, value: val, on: { input: e => fn(Number(e.target.value)) } }));
}

function buildPanel(S) {
  const it = S.items.find(i => i.id === S.sel);
  if (!it) return h('div', { class: 'hint' }, '要素をタップして選択。ドラッグで移動、右下の丸で大きさを変えられます。');
  const box = h('div', { class: 'pbox' });
  if (it.type === 'text') {
    box.append(h('textarea', { rows: 2, value: it.text, on: { input: e => {
      it.text = e.target.value; patchEl(S, it); markDirty(S);
    } } }));
    box.append(slider('文字サイズ', 1.5, 14, 0.5, it.size, v => { it.size = v; patchEl(S, it); markDirty(S); }));
    const aligns = { left: '左', center: '中', right: '右' };
    box.append(h('div', { class: 'prow' },
      h('input', { type: 'color', value: it.color || '#5a1a2a', on: { input: e => { it.color = e.target.value; patchEl(S, it); markDirty(S); } } }),
      h('button', { class: 'small' + (it.bold ? ' on' : ' ghost'), on: { click: () => { it.bold = !it.bold; patchEl(S, it); markDirty(S); refreshPanel(S); } } }, '太字'),
      ...Object.entries(aligns).map(([k, label]) =>
        h('button', { class: 'small' + (it.align === k ? ' on' : ' ghost'), on: { click: () => { it.align = k; patchEl(S, it); markDirty(S); refreshPanel(S); } } }, label))));
  }
  box.append(slider('大きさ', 6, 100, 1, it.w, v => {
    it.w = v;
    if (it.ratio) it.h = v * it.ratio;
    if (it.y + it.h > 100) it.h = 100 - it.y;
    patchEl(S, it); markDirty(S);
  }));
  box.append(h('div', { class: 'prow' },
    h('button', { class: 'ghost small', on: { click: () => moveZ(S, it, 1) } }, '前へ'),
    h('button', { class: 'ghost small', on: { click: () => moveZ(S, it, -1) } }, '後ろへ'),
    h('button', { class: 'ghost small', on: { click: () => duplicate(S, it) } }, '複製'),
    h('button', { class: 'danger small', on: { click: () => removeItem(S, it) } }, '削除')));
  return box;
}

function moveZ(S, it, dir) {
  const arr = [...S.items].sort((a, b) => a.z - b.z);
  const i = arr.indexOf(it), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i].z, arr[j].z] = [arr[j].z, arr[i].z];
  markDirty(S);
  refreshEditor(S);
}
function duplicate(S, it) {
  const c = { ...it, id: uid(), x: Math.min(it.x + 4, 100 - it.w), y: Math.min(it.y + 4, 100 - it.h), z: nextZ(S) };
  S.items.push(c);
  S.sel = c.id;
  markDirty(S);
  refreshEditor(S);
}
function removeItem(S, it) {
  S.items = S.items.filter(i => i.id !== it.id);
  S.sel = null;
  markDirty(S);
  refreshEditor(S);
}

// ---------- メディア ----------
function natural(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res({ nw: i.naturalWidth, nh: i.naturalHeight });
    i.onerror = rej;
    i.src = url;
  });
}
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s);
  c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

async function handleFile(S, file, kind) {
  if (!file) return;
  const limit = kind === 'vid' ? 30 : 10;
  if (file.size > limit * 1024 * 1024) return alert(`${kind === 'vid' ? '動画' : '画像'}は${limit}MBまでです`);
  setStatus('アップロード中…');
  try {
    let blob = file;
    if (kind === 'img' && file.type !== 'image/gif') blob = await shrink(file);
    const ext = blob.type === 'image/jpeg' ? 'jpg'
      : ((file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin');
    const path = `${S.code}/${uid()}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || file.type, upsert: false });
    if (error) throw error;
    const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    if (kind === 'vid') {
      addItem(S, { type: 'vid', u: url, x: 15, y: 30, w: 70, h: 45 });
    } else {
      const { nw, nh } = await natural(url);
      const ratio = nh / nw * 0.75;
      let w = 70, hh = w * ratio;
      if (hh > 80) { hh = 80; w = hh / ratio; }
      addItem(S, { type: 'img', u: url, ratio, x: (100 - w) / 2, y: 12, w, h: hh });
    }
  } catch (e) {
    alert('アップロードに失敗しました。通信環境をご確認ください。');
    setStatus(S.dirty ? '未保存' : '保存済み');
  }
}

function stampSheet(S) {

function themeSheet(S) {

function settingsSheet(S) {

// ---------- 最終確認・公開 ----------
async function confirmScreen(S) {
  await flush(S);
  const v = validate(S);
  if (v) return alert(v);
  const preview = buildStage({ theme: S.theme, items: S.items, to: S.to, from: sender() }, 'view');
  setScreen(h('div', { class: 'viewer' },
    h('p', { class: 'steps' }, '最終確認'),
    h('div', { class: 'stagewrap-view' }, preview),
    h('section', { class: 'panel' },
      h('div', { class: 'muted' },
        `宛名：${S.to}　差出人：${sender()}`, h('br'),
        `開封：${S.openOn && S.open ? fmt(new Date(S.open).toISOString()) : 'すぐ開けます'}`, h('br'),
        `パスワード：${S.pwOn ? 'あり' : 'なし'}`)),
    h('div', { class: 'row-btns' },
      h('button', { class: 'ghost', on: { click: () => openEditor(S.token) } }, '修正する'),
      h('button', { class: 'alt', on: { click: () => publishFlow(S) } }, '公開する'))));
}

async function publishFlow(S) {
  const v = validate(S);
  if (v) return alert(v);
  const err = await saveDraft(S, true);
  if (err) return alert(err);
  S.published = true;
  S.dirty = false;
  shareScreen(S.code, S.token, true);
}

// ---------- 閲覧 ----------
async function viewer(code) {
  setScreen(loadingNode());
  const { data: info, error } = await sb.rpc('view_info', { p_code: code });
  if (error || !info || !info.found) {
    return message('見つかりません', 'このリンクは見つからないか、削除されています。');
  }
  const ctx = { code, openAt: info.open_at, offset: new Date(info.server_now).getTime() - Date.now() };
  if (info.has_password) askPassword(ctx, false);
  else attempt(ctx, null);
}

function askPassword(ctx, wrong) {
  const input = h('input', { type: 'password', placeholder: 'パスワード' });
  setScreen(h('section', { class: 'panel center' },
    h('h2', {}, 'パスワードを入力'),
    h('p', { class: 'muted' }, 'このカードはパスワードで保護されています。'),
    input,
    h('p', { class: 'err' }, wrong ? 'パスワードが違います' : ''),
    h('button', { class: 'block', on: { click: () => attempt(ctx, input.value) } }, '開く')));
}

async function attempt(ctx, pw) {
  const { data, error } = await sb.rpc('view_card', { p_code: ctx.code, p_password: pw });
  if (error) {
    const m = error.message || '';
    if (m.includes('wrong_password')) return askPassword(ctx, true);
    if (m.includes('not_yet')) return countdown(ctx, pw);
    if (m.includes('deleted') || m.includes('not_found')) return message('見つかりません', 'このカードは見つからないか、削除されています。');
    return message('エラー', '通信に失敗しました。時間をおいて再度お試しください。');
  }
  reveal(data);
}

function countdown(ctx, pw) {
  const target = new Date(ctx.openAt).getTime();
  const box = h('div', { class: 'countdown' });
  setScreen(h('section', { class: 'panel center' },
    h('h2', {}, '開封まであと'), box,
    h('p', { class: 'muted' }, '時間になると自動で開きます。このままお待ちください。')));
  let timer;
  const tick = () => {
    const s = Math.floor((target - (Date.now() + ctx.offset)) / 1000);
    if (s <= 0) {
      clearInterval(timer);
      box.textContent = '開封します…';
      setTimeout(() => attempt(ctx, pw), 800);
      return;
    }
    const d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600);
    const mm = Math.floor((s % 3600) / 60);
    box.textContent = `${d}日 ${pad(hh)}時間 ${pad(mm)}分 ${pad(s % 60)}秒`;
  };
  tick();
  timer = setInterval(tick, 1000);
}

function reveal(d) {
  const content = d.content && !Array.isArray(d.content) ? d.content : { theme: 'xmas', items: [] };
  const S = { theme: content.theme || 'xmas', items: content.items || [], to: d.to_name || '', from: d.from_name || '' };
  const dl = h('button', { class: 'block alt', on: { click: () => downloadImage(S) } }, '📥 画像として保存');
  if (d.mode === 'download') {
    return setScreen(h('section', { class: 'panel center viewer' },
      h('h2', {}, '閲覧期間は終了しました'),
      h('p', { class: 'muted' }, '画像としての保存だけできます（削除日時まで）。'),
      dl));
  }
  const stage = buildStage(S, 'view');
  stage.classList.add('reveal');
  setScreen(h('div', { class: 'viewer' },
    h('div', { class: 'stagewrap-view' }, stage),
    dl));
}

async function downloadImage(S) {
  const box = h('div', { style: 'position:fixed;left:-10000px;top:0;width:420px' });
  const st = buildStage(S, 'shot');
  box.append(st);
  document.body.append(box);
  try {
    await Promise.all([...st.querySelectorAll('img')].map(i =>
      i.complete ? null : new Promise(r => { i.onload = r; i.onerror = r; })));
    const canvas = await html2canvas(st, { scale: 2, useCORS: true, backgroundColor: null });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `card-${Date.now()}.png`;
    document.body.append(a);
    a.click();
    a.remove();
  } catch (e) {
    alert('画像の保存に失敗しました');
  } finally {
    box.remove();
  }
}

// ---------- 起動 ----------
function boot() {
  if (EDIT) return ensureSetup(() => openEditor(EDIT));
  if (VIEW) return birthGate(() => viewer(VIEW));
  ensureSetup(home);
}
boot();
</script>
